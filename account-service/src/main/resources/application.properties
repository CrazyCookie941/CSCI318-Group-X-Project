spring.application.name=account-service
server.port=8083

# This is a separate account DB. Install-Step1.ps1 migrates a stopped H2 snapshot
# from registration-service/data/registrationdb.mv.db to data/accountdb.mv.db.
spring.datasource.url=jdbc:h2:file:./data/accountdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
