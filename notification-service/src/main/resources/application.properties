spring.application.name=notification-service

server.port=8084

# Notification persistence
spring.datasource.url=jdbc:h2:file:./data/notificationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Optional Kafka account-event logging consumer. The frontend notification flow
# uses the notification REST API and does not require a Kafka broker.
notification.account-events.consumer-enabled=${ACCOUNT_EVENTS_CONSUMER_ENABLED:false}
spring.cloud.stream.bindings.accountEventConsumer-in-0.destination=account.events.v1
spring.cloud.stream.bindings.accountEventConsumer-in-0.group=notification-service
spring.cloud.stream.bindings.accountEventConsumer-in-0.contentType=application/json
