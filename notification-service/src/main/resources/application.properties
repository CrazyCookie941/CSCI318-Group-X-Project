spring.application.name=notification-service

server.port=8084

# Kafka / Spring Cloud Stream
spring.cloud.function.definition=accountEventConsumer
spring.cloud.stream.bindings.accountEventConsumer-in-0.destination=account-events
spring.cloud.stream.bindings.accountEventConsumer-in-0.group=notification-service
spring.cloud.stream.bindings.accountEventConsumer-in-0.contentType=application/json
